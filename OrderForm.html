<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" href="https://i.postimg.cc/MT0f0gTk/image.png" type="image/png">
  <title>הזמנת מונית</title>
  <style>
    body {
      background-color: #f0f2f5;
      font-family: 'Alef', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    form {
      max-width: 400px;
      width: 100%;
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      direction: rtl;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.4rem;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background-color: #1e88e5;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 1.2rem;
    }
    button:hover {
      background-color: #1565c0;
    }
    .success, .error {
      text-align: center;
      margin-top: 1rem;
      font-weight: bold;
    }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

<form id="taxi-form">
  <h2 style="text-align:center; margin-bottom: 1rem;">הזמנת מונית</h2>

  <label for="from">מאיפה:</label>
  <input type="text" id="from" name="from" placeholder="מיקום התחלה" required>

  <label for="to">לאיפה:</label>
  <input type="text" id="to" name="to" placeholder="יעד הנסיעה" required>

  <label for="people">מספר אנשים:</label>
  <input type="number" id="people" name="people" min="1" required>

  <label for="time">שעה:</label>
  <input type="time" id="time" name="time" required>

  <label for="date">תאריך:</label>
<input type="date" id="date" name="date" required>

  <label for="phone">מספר טלפון:</label>
<input type="tel" id="phone" name="phone" placeholder="0501234567" required>

  <button type="submit">הזמן נסיעה</button>
  <div id="form-message" class=""></div>


</form>

<!-- EmailJS SDK -->
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
  // אתחול EmailJS
  (function(){
    emailjs.init("mXjVT9I9cjsBTVa-K");
  })();

  // שליחה
  document.getElementById('taxi-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const message = document.getElementById('form-message');
    message.textContent = 'שולח...';
    message.className = '';

    emailjs.sendForm('service_a85tcsf', 'template_70n8mm8', this)
      .then(() => {
        message.textContent = 'ההזמנה נשלחה בהצלחה! נחזור אליך בקרוב 🚖';
        message.className = 'success';
        this.reset();
      })
      .catch(err => {
        message.textContent = 'שגיאה בשליחה. נסה שוב או פנה אלינו ישירות.';
        message.className = 'error';
        console.error('EmailJS error:', err);
      });
  });
</script>

</body>
</html>
